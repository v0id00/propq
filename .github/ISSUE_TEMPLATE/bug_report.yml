name: Bug report
description: Report a crash, wrong output, or unexpected behavior
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: propq version
      description: Output of `propq --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: The full command you ran. Omit passwords and sensitive data.
      render: bash
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config (redacted)
      description: Relevant parts of propq.toml with real hosts/users/passwords replaced by placeholders. Leave empty if you only used flags.
      render: toml
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the full error/output.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: SQL executed (sanitized), target servers, anything else relevant.
